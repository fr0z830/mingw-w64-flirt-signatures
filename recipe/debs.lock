# debs.lock: every .deb recipe.sh fetches. Pinned by exact filename and sha256;
# recipe.sh refuses to extract a file whose sha256 differs. Nothing is installed:
# each set is unpacked with `dpkg-deb -x` into $OUT/tc/<set>.
#
# fields: set  sha256  filename  pool-directory  snapshot-sha1
#   Debian sets: fetched from https://deb.debian.org/debian/<pool-directory>/<filename>,
#   falling back to https://snapshot.debian.org/file/<snapshot-sha1> (content-addressed,
#   kept forever). Checked 2026-09-26 against dists/{bookworm,trixie}/main/binary-amd64/
#   Packages (sha256 + size) and snapshot.debian.org/mr (sha1): all match.
#   Ubuntu set: https://archive.ubuntu.com/ubuntu/<pool-directory>/<filename>, falling
#   back to https://launchpad.net/ubuntu/+archive/primary/+files/<filename>; sha256 as in
#   the noble universe Packages index (apt-cache show). snapshot-sha1 is "-" there.
#
# binutils-mingw-w64 is deliberately NOT here: Debian's gcc-mingw-w64 drivers are built
# --with-as=/usr/bin/<triplet>-as --with-ld=/usr/bin/<triplet>-ld, so GCC 12 and 14 run
# the HOST binutils (checked with `gcc -v -Wl,-v`); the signed code comes only from the
# runtime archives in the gcc/g++/mingw-w64 packages below (checked with the link maps).

